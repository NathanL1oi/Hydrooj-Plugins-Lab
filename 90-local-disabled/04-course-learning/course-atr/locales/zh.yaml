Hint::icon::manage_user_import: "使用方法：\n支持 csv 格式（用 , 分隔）或 Excel 格式（用 TAB 分隔）。\n每行最少三列，最多五列，分别为：邮箱,用户名,密码,显示名,{用户信息}。（显示名和用户信息为可选）\n请使用 UTF-8 编码，否则中文可能会乱码。\n如果使用 CSV 格式（逗号分隔），则用户信息列不可用。\n例如：test@goj.wiki,user1,password1,test,{\"group\":\"class1\",\"studentId\":\"123\",\"school\":\"Genisis OJ\"}\n将创建用户：user1，密码为 password1，邮箱 test@goj.wiki，显示名为 test，学校为 Genisis OJ，学号为 123，该用户将会被分配至当前域的 class1 小组内。"
