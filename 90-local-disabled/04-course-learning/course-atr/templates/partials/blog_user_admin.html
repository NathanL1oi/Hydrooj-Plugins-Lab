{% import "components/user.html" as user with context %}
<tbody data-fragment-id="blog_user_admin-tbody">
  {%- for udoc in udocs -%}
  <tr>
    <td class="col--uid"> {{ udoc._id }} </td>
    <td class="col--user"> {{ user.render_inline(udoc, badge=false) }} </td>
    <td class="col--school"> {{ udoc.school }} </td>
    <td class="col--status">
      {%- if not udoc.blogEnabled -%}
      禁用
      {%- else -%}
      启用
      {%- endif -%}
    </td>
    <td class="col--actions">
      <a name="set_status" data-uid="{{ udoc._id }}">{% if not udoc.blogEnabled %}启用{% else %}禁用{% endif %}</a>
    </td>
  </tr>
  {%- endfor -%}
</tbody>
