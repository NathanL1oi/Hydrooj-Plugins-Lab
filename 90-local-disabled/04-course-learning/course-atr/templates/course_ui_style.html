<script>
(function () {
  function removeCourseReflectionEntry(root) {
    var scope = root || document;
    if (!scope.querySelectorAll) return;
    scope.querySelectorAll('#mistake-reflection-course-entry, .course-side-integrated-entry').forEach(function (node) {
      node.remove();
    });
    scope.querySelectorAll('.section.side a.menu__link').forEach(function (link) {
      var href = link.getAttribute('href') || '';
      if (!/\/reflection(?:$|[/?#])/.test(href)) return;
      var item = link.closest('.menu__item');
      var section = link.closest('.section.side');
      if (section && section.id === 'mistake-reflection-course-entry') section.remove();
      else if (item) item.remove();
    });
  }

  var sidebarFlowQueued = false;

  function getCourseSidebar() {
    return document.querySelector('.row[data-sticky-parent] > .medium-3.columns[data-sticky], .row[data-sticky-parent] > .medium-3.columns > [data-sticky], .row[data-sticky-parent] > .course-atr-sidebar-scroll');
  }

  function updateCourseSidebarFlow() {
    var sidebar = getCourseSidebar();
    if (!sidebar) return;
    if (window.innerWidth <= 900) {
      sidebar.classList.remove('course-atr-sidebar-long');
      sidebar.style.removeProperty('--course-sidebar-max-height');
      return;
    }
    var limit = Math.max(260, window.innerHeight - 68);
    sidebar.style.setProperty('--course-sidebar-max-height', limit + 'px');
    sidebar.classList.toggle('course-atr-sidebar-long', sidebar.scrollHeight > limit + 12);
  }

  function scheduleCourseSidebarFlow() {
    if (sidebarFlowQueued) return;
    sidebarFlowQueued = true;
    (window.requestAnimationFrame || window.setTimeout)(function () {
      sidebarFlowQueued = false;
      updateCourseSidebarFlow();
    });
  }

  function installCourseSidebarFlowGuard() {
    var sidebar = getCourseSidebar();
    if (!sidebar) return;
    if (!sidebar.__courseAtrSidebarFlowGuard && window.MutationObserver) {
      sidebar.__courseAtrSidebarFlowGuard = true;
      new MutationObserver(scheduleCourseSidebarFlow).observe(sidebar, { childList: true, subtree: true });
    }
    scheduleCourseSidebarFlow();
  }

  function installCourseReflectionGuard() {
    removeCourseReflectionEntry(document);
    var sidebar = document.querySelector('[data-sticky="large"]');
    if (!sidebar || !window.MutationObserver || sidebar.__courseAtrReflectionGuard) return;
    sidebar.__courseAtrReflectionGuard = true;
    new MutationObserver(function () {
      removeCourseReflectionEntry(sidebar);
    }).observe(sidebar, { childList: true, subtree: true });
  }

  installCourseReflectionGuard();
  installCourseSidebarFlowGuard();
  document.addEventListener('DOMContentLoaded', installCourseReflectionGuard);
  document.addEventListener('DOMContentLoaded', installCourseSidebarFlowGuard);
  document.addEventListener('vjContentNew', installCourseReflectionGuard);
  document.addEventListener('vjContentNew', installCourseSidebarFlowGuard);
  window.addEventListener('resize', scheduleCourseSidebarFlow);
  window.addEventListener('courseAtrSidebarChanged', installCourseSidebarFlowGuard);
})();
</script>
<script>
(function () {
  function getBulkRoot(button) {
    return button.closest('.course-bulk-section') || document;
  }

  function setSectionState(section, expanded) {
    var detail = section.querySelector('.training__section__detail');
    if (!detail) return;
    section.classList.toggle('expanded', expanded);
    section.classList.toggle('collapsed', !expanded);
    detail.style.display = expanded ? '' : 'none';
  }

  function setAllSections(root, expanded) {
    root.querySelectorAll('.training__section').forEach(function (section) {
      setSectionState(section, expanded);
    });
  }

  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-course-bulk-action]');
    if (!button) return;
    var action = button.getAttribute('data-course-bulk-action');
    var root = getBulkRoot(button);
    if (action === 'expand') {
      event.preventDefault();
      setAllSections(root, true);
    } else if (action === 'collapse') {
      event.preventDefault();
      setAllSections(root, false);
    }
  });
})();
</script>
