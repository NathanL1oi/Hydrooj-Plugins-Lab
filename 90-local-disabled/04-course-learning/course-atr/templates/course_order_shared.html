<style>
.course-atr-order {
  --course-order-border: var(--hub-border, var(--course-border, rgba(15, 23, 42, .10)));
  --course-order-border-soft: var(--hub-border-soft, var(--course-border-soft, rgba(15, 23, 42, .06)));
  --course-order-surface: rgba(255, 255, 255, .07);
  --course-order-surface-soft: rgba(255, 255, 255, .035);
  --course-order-surface-strong: rgba(255, 255, 255, .09);
  --course-order-hover: rgba(255, 255, 255, .12);
  --course-order-text: var(--hub-text, #24364f);
  --course-order-muted: var(--hub-muted, #64748b);
  --course-order-accent: var(--course-link, #2563eb);
  --course-order-shadow: var(--hub-shadow, 0 16px 36px rgba(15, 23, 42, .10));
  overflow: hidden;
  max-width: 1280px;
  margin: 0 auto 1.25rem;
  border: 1px solid var(--course-order-border);
  border-radius: 8px;
  background: var(--course-order-surface-soft) !important;
  color: var(--course-order-text);
  font-size: 14px;
  box-shadow: var(--course-order-shadow);
  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
}
.course-atr-order__header {
  display: flex;
  flex-wrap: wrap;
  gap: .8rem;
  align-items: flex-start;
  justify-content: space-between;
  padding: .95rem 1.1rem;
  border-bottom: 1px solid var(--course-order-border-soft);
  background: transparent !important;
}
.course-atr-order__title {
  margin: 0;
  color: var(--course-order-text);
  font-size: 1.12rem;
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.course-atr-order__tools {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  align-items: center;
  justify-content: flex-end;
}
.course-atr-order__tools .button,
.course-atr-order__footer .button {
  margin: 0 !important;
}
.course-atr-order__body {
  padding: 1rem 1.1rem 1.15rem;
  background: transparent;
}
.course-atr-order__list {
  display: grid;
  gap: .6rem;
  margin: 0 0 1rem;
  padding: 0;
  list-style: none;
}
.course-atr-order__row {
  display: grid;
  grid-template-columns: 3rem minmax(0, 1fr) minmax(15rem, auto);
  gap: .75rem;
  align-items: center;
  padding: .75rem .85rem;
  border: 1px solid var(--course-order-border);
  border-left: 1px solid var(--course-order-border);
  border-radius: 8px;
  background: var(--course-order-surface) !important;
  box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
  backdrop-filter: blur(12px) saturate(145%);
  -webkit-backdrop-filter: blur(12px) saturate(145%);
  transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.course-atr-order__row:hover {
  background: var(--course-order-hover);
}
.course-atr-order__index {
  display: inline-flex;
  width: 2rem;
  height: 2rem;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--course-order-border);
  border-radius: 8px;
  background: var(--course-order-surface-soft) !important;
  color: var(--course-order-text);
  font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24);
}
.course-atr-order__name {
  min-width: 0;
  color: var(--course-order-text);
  font-size: .96rem;
  line-height: 1.35;
  word-break: break-word;
}
.course-atr-order__name a {
  color: inherit;
}
.course-atr-order__meta {
  margin-top: .15rem;
  color: var(--course-order-muted);
  font-size: .82rem;
}
.course-atr-order__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: .35rem;
}
.course-atr-order__actions .button {
  margin: 0 !important;
  height: 1.78rem;
  min-width: 3rem;
  padding: 0 .65rem;
  border-color: var(--course-order-border);
  background: var(--course-order-surface-soft) !important;
  color: var(--course-order-text);
  line-height: 1.68rem;
  font-size: .8rem;
  box-shadow: none;
  backdrop-filter: blur(10px) saturate(140%);
  -webkit-backdrop-filter: blur(10px) saturate(140%);
}
.course-atr-order__actions .button:hover,
.course-atr-order__tools .button:not(.primary):hover,
.course-atr-order__footer .button:not(.primary):hover {
  border-color: rgba(37, 99, 235, .36);
  background: var(--course-order-hover);
  color: var(--course-order-accent);
}
.course-atr-order__actions .button[disabled] {
  opacity: .45;
  background: rgba(148, 163, 184, .12);
  color: var(--course-order-muted);
}
.course-atr-order__footer {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  align-items: center;
}
.course-atr-order__tools .button,
.course-atr-order__footer .button {
  border-color: var(--course-order-border);
  background: var(--course-order-surface-soft) !important;
  color: var(--course-order-text);
  box-shadow: none;
  backdrop-filter: blur(10px) saturate(140%);
  -webkit-backdrop-filter: blur(10px) saturate(140%);
}
.course-atr-order__tools .primary,
.course-atr-order__footer .primary {
  border-color: rgba(37, 99, 235, .32) !important;
  background: rgba(37, 99, 235, .56) !important;
  color: #fff !important;
  box-shadow: 0 10px 24px rgba(37, 99, 235, .12) !important;
}
.theme--dark .course-atr-order {
  --course-order-border: var(--hub-border, rgba(255, 255, 255, .12));
  --course-order-border-soft: var(--hub-border-soft, rgba(255, 255, 255, .08));
  --course-order-surface: rgba(255, 255, 255, .055);
  --course-order-surface-soft: rgba(255, 255, 255, .028);
  --course-order-surface-strong: rgba(255, 255, 255, .07);
  --course-order-hover: rgba(255, 255, 255, .095);
  --course-order-text: var(--hub-text, #e2e8f0);
  --course-order-muted: var(--hub-muted, #94a3b8);
  --course-order-shadow: var(--hub-shadow, 0 18px 40px rgba(0, 0, 0, .24));
}
html.hydro-user-background-enabled .course-atr-order {
  border-color: var(--course-order-border) !important;
  background: var(--course-order-surface-soft) !important;
  box-shadow: var(--course-order-shadow) !important;
}
html.hydro-user-background-enabled .course-atr-order__header,
html.hydro-user-background-enabled .course-atr-order__body {
  background: transparent !important;
}
html.hydro-user-background-enabled .course-atr-order__row,
html.hydro-user-background-enabled .course-atr-order__actions .button,
html.hydro-user-background-enabled .course-atr-order__tools .button,
html.hydro-user-background-enabled .course-atr-order__footer .button {
  border-color: var(--course-order-border) !important;
  background: var(--course-order-surface-soft) !important;
  color: var(--course-order-text) !important;
}
html.hydro-user-background-enabled .course-atr-order__tools .primary,
html.hydro-user-background-enabled .course-atr-order__footer .primary {
  background: rgba(37, 99, 235, .56) !important;
  color: #fff !important;
}
@media screen and (max-width: 720px) {
  .course-atr-order__row {
    grid-template-columns: 2.5rem minmax(0, 1fr);
  }
  .course-atr-order__actions {
    grid-column: 2;
    justify-content: flex-start;
  }
}
</style>
<script>
(function () {
  function init(root) {
    if (!root || root.dataset.courseAtrOrderReady) return;
    root.dataset.courseAtrOrderReady = '1';
    var list = root.querySelector('[data-course-atr-order-list]');
    var input = root.querySelector('[data-course-atr-order-input]');
    var form = root.querySelector('[data-course-atr-order-form]');
    if (!list || !input || !form) return;

    function rows() {
      return Array.prototype.slice.call(list.querySelectorAll('[data-course-atr-order-item]'));
    }

    function sync() {
      var items = rows();
      input.value = items.map(function (row) { return row.getAttribute('data-id') || ''; }).filter(Boolean).join(',');
      items.forEach(function (row, index) {
        var number = row.querySelector('[data-course-atr-order-index]');
        if (number) number.textContent = String(index + 1);
        row.querySelectorAll('[data-course-atr-order-action]').forEach(function (button) {
          var action = button.getAttribute('data-course-atr-order-action');
          button.disabled = (index === 0 && (action === 'top' || action === 'up'))
            || (index === items.length - 1 && (action === 'down' || action === 'bottom'));
        });
      });
    }

    function move(row, action) {
      if (!row) return;
      if (action === 'top') list.insertBefore(row, list.firstElementChild);
      if (action === 'up' && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
      if (action === 'down' && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
      if (action === 'bottom') list.appendChild(row);
      sync();
    }

    root.addEventListener('click', function (event) {
      var button = event.target.closest('[data-course-atr-order-action]');
      if (!button || !root.contains(button)) return;
      event.preventDefault();
      move(button.closest('[data-course-atr-order-item]'), button.getAttribute('data-course-atr-order-action'));
    });
    form.addEventListener('submit', sync);
    sync();
  }

  function initAll() {
    document.querySelectorAll('[data-course-atr-order]').forEach(init);
  }

  initAll();
  document.addEventListener('vjContentNew', initAll);
})();
</script>
