{% import "components/home.html" as home with context %}
{% extends "layout/basic.html" %}
{% block content %}
<div class="ca-scope ca-home">
  <div class="row" data-sticky-parent>
    <div class="medium-10 columns">
      <div class="ca-home-content ca-fade">
        {% block home_content %}{% endblock %}
      </div>
    </div>
    <div class="medium-2 columns"><div data-sticky="large">
      {{ home.render_sidebar() }}
      {% block home_sidebar %}{% endblock %}
    </div></div>
  </div>
</div>
{% endblock %}
