{% extends "layout/immersive.html" %}
{% block content %}
<div class="ca-scope ca-auth">
  <div class="ca-auth__card ca-fade">
    <h1 class="ca-auth__title">{{ _('Sign Up') }}</h1>
    <form method="POST" captcha>
      <div class="ca-field">
        <label class="ca-label" for="auth-mail">{{ _('Email') }}</label>
        <input id="auth-mail" name="mail" type="text" class="ca-input" autofocus>
      </div>
      <div class="ca-auth__captcha">
        {{ captcha|safe }}
      </div>
      <div class="ca-auth__actions">
        <input id="submit" type="submit" value="{{ _('Send Verification Email') }}" class="ca-btn ca-btn--block">
      </div>
    </form>
  </div>
</div>
{% endblock %}
