<style>
/* ================================================================
   Part 1: Global chrome reskin (html.theme--default / theme--light)
   ================================================================ */

html.theme--light .pager__item.current {

@media (prefers-reduced-motion: reduce) {
  html.theme--default .button,

}
</style>
<style>
/* ================================================================
   Part 2: .ca-* scoped design system (same as course plugin).
   Used by rewritten templates that wrap content in .ca-scope.
   ================================================================ */
/* ---------- Design tokens & base ---------- */
.ca-scope {
  --ca-blue: #0071e3;
  --ca-blue-hover: #0077ed;
  --ca-link: #0066cc;
  --ca-text: #1d1d1f;
  --ca-gray: #6e6e73;
  --ca-gray-2: #86868b;
  --ca-bg: #ffffff;
  --ca-bg-alt: #f5f5f7;
  --ca-fill: rgba(0, 0, 0, 0.04);
  --ca-green: #1e7d34;
  --ca-red: #d70015;
  --ca-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
  --ca-shadow-hover: 0 14px 40px rgba(0, 0, 0, 0.1);
  --ca-radius: 18px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--ca-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.ca-scope *, .ca-scope *::before, .ca-scope *::after { box-sizing: border-box; }
.ca-scope a { color: var(--ca-link); text-decoration: none; }
.ca-scope a:hover { color: var(--ca-link); text-decoration: none; }

/* ---------- Layout ---------- */
.ca-scope {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 40px 64px;
}
.ca-scope .ca-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 32px;
  align-items: start;
}
.ca-scope .ca-layout--wide { grid-template-columns: minmax(0, 1fr); }
.ca-scope .ca-side-stack { display: flex; flex-direction: column; gap: 24px; }
.ca-scope .ca-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
}
@media (max-width: 968px) {
  .ca-scope { padding: 16px 20px 48px; }
  .ca-scope .ca-layout { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .ca-scope .ca-grid-2 { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Hero ---------- */
.ca-scope .ca-hero {
  background: var(--ca-bg-alt);
  border-radius: 28px;
  padding: 72px 48px 64px;
  text-align: center;
  margin-bottom: 40px;
  overflow: hidden;
}
.ca-scope .ca-hero--compact { padding: 44px 40px 40px; text-align: left; }
.ca-scope .ca-hero__row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.ca-scope .ca-hero__text { min-width: 0; flex: 1; }
.ca-scope .ca-eyebrow {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ca-gray);
  margin: 0 0 12px;
}
.ca-scope .ca-eyebrow a { color: var(--ca-gray); transition: color 0.15s ease; }
.ca-scope .ca-eyebrow a:hover { color: var(--ca-link); }
.ca-scope .ca-eyebrow .ca-sep { color: #aeaeb2; margin: 0 8px; font-weight: 400; }
.ca-scope .ca-headline {
  font-size: clamp(32px, 4.6vw, 52px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.08;
  margin: 0;
  color: var(--ca-text);
}
.ca-scope .ca-hero--compact .ca-headline { font-size: clamp(26px, 3.4vw, 38px); }
.ca-scope .ca-headline--gradient {
  background: linear-gradient(92deg, #0090ff 0%, #7d4bff 52%, #ff5e8a 100%);

  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.ca-scope .ca-subhead {
  font-size: 17px;
  line-height: 1.55;
  color: var(--ca-gray);
  max-width: 680px;
  margin: 14px auto 0;
}

.ca-scope .ca-hero__meta {

  margin-top: 24px;

}

/* ---------- Buttons ---------- */
.ca-scope .ca-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: 980px;
  background: var(--ca-blue);

.ca-scope .ca-btn--gray { background: #e8e8ed; color: var(--ca-text); }

.ca-scope .ca-btn--ghost:hover { background: rgba(0, 113, 227, 0.08); color: var(--ca-blue); box-shadow: inset 0 0 0 1px var(--ca-blue); }
.ca-scope .ca-btn--danger { background: transparent; color: var(--ca-red); box-shadow: inset 0 0 0 1px rgba(215, 0, 21, 0.4); }
.ca-scope .ca-btn--danger:hover { background: rgba(215, 0, 21, 0.06); color: var(--ca-red); box-shadow: inset 0 0 0 1px var(--ca-red); }
