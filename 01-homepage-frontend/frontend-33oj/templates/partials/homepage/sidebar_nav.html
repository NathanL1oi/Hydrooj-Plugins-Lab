<div class="section side">
  <div class="section__body">
    <div style="display: flex; flex-direction: column; gap: 16px;">
      {% for group in payload %}
        <div>
          <div class="ca-eyebrow" style="margin: 0 0 8px; font-size: 11px;">{{ group.title }}</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            {% for row in group.urls %}
              <a class="ca-chip" href="{{ row.url }}" target="_blank">{{ row.name }}</a>
            {% endfor %}
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
