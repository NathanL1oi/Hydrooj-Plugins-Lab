{% set pdocs = payload[0] %}
{% set psdict = payload[1] %}
{% if pdocs.length %}
  <div class="section side nojs--hide">
    <div class="section__header">
      <h1 class="section__title">{{ _('Recent Problems') }}</h1>
    </div>
    <div class="section__body typo no-media col--problem-name">
      <div class="ca-discuss">
        {%- for pdoc in pdocs -%}
          <div class="ca-discuss__item">
            {{ problem.render_problem_title(pdoc, show_tags=false, show_invisible_flag=false, show_pid=false) }}
            <span class="ca-discuss__author">{{ datetimeSpan(pdoc._id)|safe }}</span>
          </div>
        {%- endfor -%}
      </div>
    </div>
  </div>
{% endif %}
